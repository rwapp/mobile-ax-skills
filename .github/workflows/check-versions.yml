name: Check versions

# Guards the fixed-versioning rule: every skills/**/SKILL.md must carry the same `version:`
# as the canonical VERSION file. The release workflow keeps them in sync; this fails a PR that
# hand-edits a skill's version (which contributors must not do).

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify-versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify all SKILL.md match VERSION
        run: bash scripts/stamp-version.sh --check
